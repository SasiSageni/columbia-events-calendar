[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["scripts/**", "server/**", "public/data/events.json"]

[[redirects]]
  from = "/data/events.json"
  to = "/.netlify/functions/events"
  status = 200
  force = true
